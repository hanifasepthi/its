    .webmcp-tools {
      position: fixed !important;
      inset: 0 auto auto 0;
      z-index: -1;
      width: 1px !important;
      height: 1px !important;
      max-width: 1px !important;
      max-height: 1px !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      clip-path: inset(50%) !important;
      white-space: nowrap;
      border: 0 !important;
      opacity: 0.001;
      pointer-events: none !important;
      contain: strict;
    }

    .webmcp-tools summary {
      display: block;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .map-app-skeleton {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #eef3ee;
      font-family: Inter, system-ui, sans-serif;
    }
    .map-app-skeleton::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(29deg, transparent 0 29%, rgba(255,255,255,.96) 29.4% 31.1%, transparent 31.5% 100%),
        linear-gradient(92deg, transparent 0 43%, rgba(255,255,255,.95) 43.4% 45.5%, transparent 45.9% 100%),
        linear-gradient(151deg, transparent 0 61%, rgba(255,255,255,.9) 61.4% 63.7%, transparent 64.1% 100%),
        repeating-linear-gradient(12deg, rgba(207,218,210,.58) 0 2px, transparent 2px 50px),
        repeating-linear-gradient(102deg, rgba(207,218,210,.5) 0 2px, transparent 2px 66px);
    }
    .map-skeleton-header {
      position: absolute;
      z-index: 2;
      top: 14px;
      left: 14px;
      right: 14px;
      display: grid;
      grid-template-columns: 48px minmax(180px, 420px) 48px;
      gap: 10px;
      align-items: center;
    }
    .map-skeleton-logo,
    .map-skeleton-layer,
    .map-skeleton-search,
    .map-skeleton-control,
    .map-skeleton-poi {
      background: linear-gradient(100deg, #fff 30%, #edf3f1 48%, #fff 66%);
      background-size: 240% 100%;
      animation: its-skeleton-shimmer 1.35s ease-in-out infinite;
      box-shadow: 0 5px 20px rgba(28, 56, 48, .12);
    }
    .map-skeleton-logo,
    .map-skeleton-layer,
    .map-skeleton-control { width: 48px; height: 48px; border-radius: 15px; }
    .map-skeleton-search { height: 48px; border-radius: 17px; }
    .map-skeleton-controls { position: absolute; z-index: 2; right: 16px; bottom: 82px; display: grid; gap: 8px; }
    .map-skeleton-poi { position: absolute; width: 22px; height: 22px; border: 4px solid #fff; border-radius: 50% 50% 50% 8px; transform: rotate(-45deg); }
    .map-skeleton-poi:nth-of-type(1) { left: 27%; top: 35%; }
    .map-skeleton-poi:nth-of-type(2) { left: 62%; top: 54%; animation-delay: -.3s; }
    .map-skeleton-poi:nth-of-type(3) { left: 47%; top: 72%; animation-delay: -.6s; }
    .map-skeleton-footer { position: absolute; z-index: 2; left: 14px; right: 14px; bottom: 14px; height: 48px; border-radius: 16px; background: rgba(255,255,255,.9); box-shadow: 0 5px 20px rgba(28,56,48,.1); }
    .map-skeleton-accessible { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @keyframes its-skeleton-shimmer { to { background-position: -140% 0; } }
    @media (max-width: 560px) {
      .map-skeleton-header { grid-template-columns: 44px minmax(0, 1fr) 44px; }
      .map-skeleton-logo, .map-skeleton-layer, .map-skeleton-control { width: 44px; height: 44px; }
      .map-skeleton-search { height: 44px; }
    }
  </style>

<body>
  <its-maps-app>
    <div id="app">
      <main class="map-app-skeleton" aria-busy="true" aria-label="Memuat peta ITS Maps">
      <div class="map-skeleton-header" aria-hidden="true">
        <span class="map-skeleton-logo"></span>
        <span class="map-skeleton-search"></span>
        <span class="map-skeleton-layer"></span>
      </div>
      <span class="map-skeleton-poi" aria-hidden="true"></span>
      <span class="map-skeleton-poi" aria-hidden="true"></span>
      <span class="map-skeleton-poi" aria-hidden="true"></span>
      <div class="map-skeleton-controls" aria-hidden="true">
        <span class="map-skeleton-control"></span>
        <span class="map-skeleton-control"></span>
      </div>
      <div class="map-skeleton-footer" aria-hidden="true"></div>
      <div class="map-skeleton-accessible">
        <h1>ITS Maps</h1>
        <p>Peta jalan, transportasi, POI, perairan, area hijau, kamera, dan navigasi 2D serta 3D sedang dimuat.</p>
        <nav aria-label="Tautan utama ITS Maps">
          <a href="/documentation">Dokumentasi</a>
          <a href="/method">Metode</a>
          <a href="/privacy">Privasi</a>
        </nav>
      </div>
      </main>
    </div>
  </its-maps-app>
  <details class="webmcp-tools" aria-label="ITS Maps WebMCP tools">
    <summary>AI agent tools</summary>
    <p>WebMCP tools for public ITS Maps navigation and documentation.</p>
    <form method="get" action="/documentation" data-webmcp-open-resource toolname="open_its_maps_resource" tooldescription="Open a public ITS Maps resource such as documentation, privacy policy, licence, PDF preview, llms.txt, or the realtime map." toolautosubmit>
      <label>
        Resource
        <select name="resource" title="ITS Maps resource" aria-description="Choose the public ITS Maps page or agent resource to open." toolparamdescription="Public ITS Maps resource to open. Choose one of home, documentation, method, privacy, licence, ai-license, roadmap, pdf, llms, or about.">
          <option value="documentation">documentation</option>
          <option value="home">home</option>
          <option value="method">method</option>
          <option value="privacy">privacy</option>
          <option value="licence">licence</option>
          <option value="ai-license">ai-license</option>
          <option value="roadmap">roadmap</option>
          <option value="pdf">pdf</option>
          <option value="llms">llms</option>
          <option value="about">about</option>
        </select>
      </label>
      <button type="submit">Open ITS Maps resource</button>
    </form>
    <form method="get" action="/documentation" data-webmcp-site-search toolname="search_its_maps_site" tooldescription="Search public ITS Maps documentation and route the user to the documentation page with the requested query." toolautosubmit>
      <label>
        Query
        <input type="search" name="query" title="ITS Maps search query" aria-description="Enter a topic to search in the public ITS Maps documentation." autocomplete="off" toolparamdescription="Search query for public ITS Maps documentation, downloads, widgets, AI, privacy, or source-code explanation.">
      </label>
      <button type="submit">Search ITS Maps</button>
    </form>
    <form method="get" action="/llms.txt" data-webmcp-public-context toolname="get_its_maps_public_context" tooldescription="Return public ITS Maps AI-agent context from llms.txt or llms-full.txt." toolautosubmit>
      <label>
        Format
        <select name="format" title="Public context format" aria-description="Choose summary or full ITS Maps public AI context." toolparamdescription="Context size to return for AI agents. Use summary for llms.txt or full for llms-full.txt.">
          <option value="summary">summary</option>
          <option value="full">full</option>
        </select>
      </label>
      <button type="submit">Read ITS Maps context</button>
    </form>
  </details>
  <script type="module" src="./src/main.ts"></script>
</body>
